worker_processes 1;
pid /tmp/nginx.pid;
# Capability URLs and file references must not appear in proxy logs.
error_log /dev/null;

events {
    worker_connections 256;
}

http {
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 64k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 60s;
    keepalive_timeout 15s;

    # Peer address only; never trust arbitrary client X-Forwarded-For.
    limit_req_zone $binary_remote_addr zone=per_peer:1m rate=2r/s;
    limit_req_zone $server_name zone=whole_service:1m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=connections:1m;
    limit_req_status 429;
    limit_conn_status 429;

    upstream epubdoctor {
        server app:8000;
    }

    server {
        listen 8080;
        server_name _;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control no-store always;

        location = /healthz {
            proxy_pass http://epubdoctor;
            proxy_set_header Host localhost;
            proxy_connect_timeout 2s;
            proxy_read_timeout 3s;
        }

        location = /mcp {
            limit_req zone=per_peer burst=10 nodelay;
            limit_req zone=whole_service burst=20 nodelay;
            limit_conn connections 8;
            proxy_pass http://epubdoctor;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 240s;
        }

        location /download/ {
            limit_req zone=per_peer burst=5 nodelay;
            limit_req zone=whole_service burst=20 nodelay;
            limit_conn connections 4;
            proxy_pass http://epubdoctor;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 70s;
        }

        location / {
            return 404;
        }
    }
}
